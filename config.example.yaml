# Agentic Dataset Generation Configuration

# Model Configuration
model:
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1/chat/completions"
  name: "openrouter/elephant-alpha"
  api_key_env: "OPENROUTER_API_KEY"
  reasoning_effort: "medium"
  system_prompt: null
  max_turns: 50

# OpenAI-compatible examples:
# - OpenAI cloud:
#   provider: "openai"
#   name: "gpt-4.1-mini"
#   api_key_env: "OPENAI_API_KEY"
# - vLLM / llama.cpp / other local OpenAI-compatible server:
#   provider: "openai"
#   base_url: "http://localhost:8000/v1"
#   name: "Qwen/Qwen2.5-Coder-32B-Instruct"
#   # Local endpoints can omit api_key/api_key_env

# Prompts Configuration
prompts:
  source: "prompts.txt"
  limit: null
  shuffle: false

# Tool Configuration
tools:
  enabled:
    - read_file
    - write_file
    - edit_file
    - list_directory
    - search_code
    - run_command
    - web_search
    - workspace_snapshot
    - context7:*
  web_search:
    searxng_url: "http://localhost:your-searxng-port"
  custom_python_modules:
    - custom_tools.example_tools
  strict_mcp: false
  mcp_servers:
    context7:
      transport: "http"
      url: "https://mcp.context7.com/mcp"
      timeout: 30
      tool_name_prefix: "context7"
      headers:
        CONTEXT7_API_KEY: "YOUR_API_KEY"

# Workspace Configuration
workspace:
  base_dir: "sandbox"
  cleanup: true
  preserve_on_error: true
  command_runner:
    mode: "docker"
    tool_scope: "all"
    docker_image: "agentic-datagen-session-runtime:latest"

# Output Configuration
output:
  dataset_file: "datasets/agentic_dataset.jsonl"
  run_manifest_file: "datasets/agentic_dataset.manifest.json"
  append_mode: true

# Processing Configuration
processing:
  concurrency: 1
  resume: true
